  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const PERGUNTA = "Qual é o nome da rosa?";
    const PASSWORD = "albardeira";

    while (true) {
      const input = window.prompt(PERGUNTA);

      if (input && input.trim().toLowerCase() === PASSWORD) {
        break; // entra
      }
    }
  });
